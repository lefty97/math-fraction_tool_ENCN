<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decimal Master Explorer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            text-align: center;
            padding: 0 20px 40px 20px;
            margin: 0;
        }
        .nav-bar {
            background-color: #34495e;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 0 0 10px 10px;
        }
        .nav-bar a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            margin: 0 10px;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s;
            display: inline-block;
        }
        .nav-bar a:hover, .nav-bar a.active { background-color: #e67e22; }
        .container {
            background-color: white;
            max-width: 950px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
        }
        .lang-switch { position: absolute; top: 20px; right: 20px; }
        .lang-switch select { font-size: 1rem; padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; }
        .section-divider { margin: 50px 0; border: 0; height: 2px; background-image: linear-gradient(to right, transparent, #bdc3c7, transparent); }
        
        .controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px; font-size: 1.1rem; flex-wrap: wrap; margin-top: 20px; }
        input[type="number"], input[type="text"], select.setting-select { font-size: 1.1rem; padding: 5px; border: 1px solid #bdc3c7; border-radius: 4px; }
        .visual-input { width: 75px; text-align: center; font-weight: bold; }
        
        .input-fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; background: #fff; border: 1px solid #bdc3c7; border-radius: 5px; padding: 2px 5px; margin: 0 5px;}
        .input-fraction input { border: none; width: 50px; text-align: center; font-size: 1.1rem; outline: none; background: transparent; padding: 0;}
        .input-fraction .divider { width: 100%; border-top: 2px solid #333; margin: 2px 0; }

        .equation { font-size: 1.8rem; font-weight: bold; margin: 20px 0; padding: 15px; border-radius: 10px; line-height: 1.4; }
        .eq-orange { background-color: #fff9c4; color: #d35400; }
        .eq-blue { background-color: #ebf5fb; color: #2980b9; }
        .eq-purple { background-color: #f4ecf7; color: #8e44ad; }
        
        .vis-area { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 40px; margin-top: 20px; min-height: 250px; }

        .jumper-wrapper { margin: 30px auto; width: fit-content; display: flex; flex-direction: column; align-items: center; }
        .jumper-track { position: relative; font-family: 'Courier New', Courier, monospace; font-size: 2.5rem; font-weight: bold; background: #fdfefe; padding: 20px 20px 50px 20px; border-radius: 12px; border: 3px solid #d7bde2; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .jumper-digits { display: flex; height: 50px; line-height: 50px; }
        .digit { width: 36px; text-align: center; transition: color 0.3s ease; }
        .digit.real { color: #2c3e50; }
        .digit.ghost { color: rgba(0, 0, 0, 0.12); } 
        .dot {
            position: absolute; bottom: 50px; color: #e67e22; width: 12px; margin-left: -6px; text-align: center;
            transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
            z-index: 10; font-size: 3rem; text-shadow: 0 2px 4px rgba(230,126,34,0.4);
        }
        .jump-svg { position: absolute; bottom: 10px; left: 20px; width: calc(100% - 40px); height: 40px; pointer-events: none; overflow: visible; }

        .quiz-panel { background-color: #fef9e7; padding: 25px; border-radius: 10px; margin-top: 20px; }
        #quiz-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .question-item { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 2px solid #f9e79f; }
        .question-row { font-size: 1.4rem; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .fraction-display { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; }
        .fraction-display span.num { border-bottom: 2px solid #333; padding: 0 5px; }
        .fraction-display span.den { padding: 0 5px; }
        .quiz-input { width: 75px; text-align: center; font-size: 1.25rem; margin: 0 2px; border: 2px solid #bdc3c7; border-radius: 4px; outline: none; }
        .quiz-input.correct { background-color: #d5f5e3; border-color: #27ae60; color: #27ae60; font-weight: bold;}
        .quiz-input.wrong { background-color: #fadedb; border-color: #e74c3c; color: #e74c3c; font-weight: bold;}
        
        .solution-box { background-color: #ebf5fb; color: #333; padding: 15px; margin-top: 15px; border-radius: 8px; display: none; text-align: left; line-height: 1.6; border: 1px dashed #2980b9; font-size: 1.1rem; }
        .score-display { font-size: 1.8rem; font-weight: bold; color: #27ae60; margin-top: 20px; }

        .btn { background-color: #e67e22; color: white; border: none; padding: 8px 15px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; transition: 0.2s; font-weight: bold;}
        .btn:hover { background-color: #d35400; }
        .btn-check { background-color: #27ae60; font-size: 1.3rem; padding: 12px 30px; margin-top: 20px;}
        .btn-sol { background-color: #2980b9; color: white; border: none; padding: 5px 10px; font-size: 1rem; border-radius: 5px; cursor: pointer; margin-left: 10px; display: none;}
        
        .submit-area { background-color: #fff; border: 2px dashed #bdc3c7; border-radius: 10px; padding: 15px; margin: 25px auto; display: none; max-width: 500px; }
        #student-name { margin-top: 15px; display: none; width: 80%; }
        .slider-group { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .slider-row { display: flex; align-items: center; gap: 15px; font-size: 1.2rem; font-weight: bold; }
        input[type="range"] { width: 150px; cursor: pointer; }
    </style>
</head>
<body>

<div class="nav-bar">
    <a href="index.html">🍕 Fractions</a>
    <a href="decimal.html" class="active">🎯 Decimals</a>
    <a href="1a2b.html">🔢 1A2B Game</a>
    <a href="angles.html">📐 Geometry Explorer</a>
</div>

<div class="container">
    <div class="lang-switch">
        <select id="language" onchange="changeLanguage()">
            <option value="en" selected>English</option>
            <option value="zh">繁體中文</option>
            <option value="ja">日本語</option>
        </select>
    </div>

    <h2 id="text-title1">🟩 Decimal Place Value Explorer</h2>
    <div class="vis-area" style="align-items: flex-start; min-height: 250px;">
        <div class="slider-group">
            <div class="slider-row" style="color: #d35400;"><span id="text-tenths">Tenths:</span> <span id="val-t" style="width:20px;">3</span><input type="range" id="slide-t" min="0" max="9" value="3"></div>
            <div class="slider-row" style="color: #2980b9;"><span id="text-hundredths">Hundredths:</span> <span id="val-h" style="width:20px;">4</span><input type="range" id="slide-h" min="0" max="9" value="4"></div>
            <div class="slider-row" style="color: #27ae60;"><span id="text-thousandths">Thousandths:</span> <span id="val-th" style="width:20px;">5</span><input type="range" id="slide-th" min="0" max="9" value="5"></div>
        </div>
        <svg viewBox="0 0 100 100" width="250" height="250" id="decimal-grid" style="background:#fdf2e9; border:2px solid #333;"></svg>
    </div>
    <div class="equation eq-orange" id="eq-place-value"></div>

    <hr class="section-divider">

    <h2 id="text-title-jump">🚀 Decimal Point Jumper</h2>
    <div class="controls">
        <input type="text" id="jump-num" class="visual-input" style="width: 110px;" value="465" oninput="initJumper()">
        <select id="jump-op" class="setting-select" style="font-size: 1.5rem; font-weight:bold;" onchange="initJumper()">
            <option value="mult">×</option>
            <option value="div">÷</option>
        </select>
        <select id="jump-pow" class="setting-select" style="font-weight:bold;" onchange="initJumper()">
            <option value="10">10 (1 zero)</option>
            <option value="100" selected>100 (2 zeros)</option>
            <option value="1000">1000 (3 zeros)</option>
        </select>
        <button class="btn" style="background:#8e44ad;" id="btn-play-jump" onclick="playJumper()">▶ Play Jump</button>
    </div>
    <div class="jumper-wrapper">
        <div class="jumper-track">
            <div id="jumper-digits" class="jumper-digits"></div>
            <div id="jumper-dot" class="dot">.</div>
            <svg id="jump-svg" class="jump-svg">
                <defs>
                    <marker id="arrow-mult" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0 0, 10 5, 0 10" fill="#e74c3c" /></marker>
                    <marker id="arrow-div" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0 0, 10 5, 0 10" fill="#3498db" /></marker>
                </defs>
            </svg>
        </div>
        <div class="equation eq-purple" id="eq-jump" style="min-height: 40px; margin-top:20px;"></div>
    </div>

    <hr class="section-divider">

    <h2 id="text-title3">📝 Decimal Practice Generator</h2>
    <div class="quiz-panel">
        <div class="quiz-settings">
            <select id="quiz-type" class="setting-select">
                <option value="mix" id="opt-q-all">All Types</option>
                <option value="d2f">Decimal ➔ Fraction</option>
                <option value="f2d">Fraction ➔ Decimal</option>
                <option value="compare">Comparing</option>
                <option value="powers">×/÷ 10, 100, 1000</option>
            </select>
            <select id="quiz-year" class="setting-select">
                <option value="4" selected>Year 4</option>
                <option value="5">Year 5</option>
                <option value="6">Year 6</option>
            </select>
            <select id="quiz-count" class="setting-select">
                <option value="4">4</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
            </select>
            <button class="btn" id="btn-generate" onclick="generateQuiz()">Generate</button>
        </div>

        <div id="quiz-container"></div>
        
        <div id="submit-area" class="submit-area">
            <label><input type="checkbox" id="chk-submit" onchange="toggleNameInput()"> <span id="text-submit-teacher">Submit to teacher</span></label><br>
            <input type="text" id="student-name" placeholder="Name">
            <div id="submit-status" style="margin-top:10px; font-weight:bold;"></div>
        </div>
        <button class="btn btn-check" id="btn-check" style="display:none" onclick="checkAnswers()">Check Answers</button>
        <div id="score-display" class="score-display"></div>
    </div>
</div>

<script>
    const teacherEmail = "anita20700@gmail.com";
    const translations = {
        en: {
            scoreMsg: "You scored {score} / {total}!",
            sentSuccess: "✅ Sent!", sentError: "❌ Error", requireName: "⚠️ Enter name!"
        },
        zh: {
            scoreMsg: "你答對了 {score} / {total} 題！",
            sentSuccess: "✅ 成績已送出！", sentError: "❌ 傳送失敗", requireName: "⚠️ 請輸入名字！"
        }
    };

    let currentLang = 'en';
    let currentQuizData = [];

    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function changeLanguage() {
        currentLang = document.getElementById('language').value;
        localStorage.setItem('mySiteLang', currentLang);
        updatePlaceValue(); initJumper();
    }

    // --- 位值視覺化 ---
    function updatePlaceValue() {
        const t = parseInt(document.getElementById('slide-t').value), h = parseInt(document.getElementById('slide-h').value), th = parseInt(document.getElementById('slide-th').value);
        document.getElementById('val-t').innerText = t; document.getElementById('val-h').innerText = h; document.getElementById('val-th').innerText = th;
        const decVal = ((t * 100 + h * 10 + th) / 1000).toFixed(3);
        document.getElementById('eq-place-value').innerText = `${decVal} = ${t}/10 + ${h}/100 + ${th}/1000`;
        const svg = document.getElementById('decimal-grid'); svg.innerHTML = '';
        for (let i = 0; i <= 100; i+=10) {
            svg.innerHTML += `<line x1="${i}" y1="0" x2="${i}" y2="100" stroke="#bdc3c7" stroke-width="0.3"/><line x1="0" y1="${i}" x2="100" y2="${i}" stroke="#bdc3c7" stroke-width="0.3"/>`;
        }
        if (t > 0) svg.innerHTML += `<rect x="0" y="0" width="${t*10}" height="100" fill="#e67e22" opacity="0.7"/>`;
        if (h > 0) svg.innerHTML += `<rect x="${t*10}" y="0" width="10" height="${h*10}" fill="#3498db" opacity="0.7"/>`;
        if (th > 0) { for(let i=0; i<th; i++) svg.innerHTML += `<rect x="${t*10+i}" y="${h*10}" width="1" height="10" fill="#2ecc71"/>`; }
    }
    ['slide-t', 'slide-h', 'slide-th'].forEach(id => document.getElementById(id).addEventListener('input', updatePlaceValue));

    // --- 跳跳蛙動畫 ---
    let jumperState = {};
    function initJumper() {
        document.getElementById('jump-svg').innerHTML = '';
        let valStr = document.getElementById('jump-num').value.trim();
        if(!valStr || isNaN(valStr)) return;
        let isInt = !valStr.includes('.');
        let cleanStr = valStr.replace('.', '');
        let origDot = isInt ? valStr.length : valStr.indexOf('.');
        let leftPad = 6, rightPad = 6;
        jumperState.currDot = leftPad + origDot;
        jumperState.digits = Array(leftPad).fill('0').concat(cleanStr.split('')).concat(Array(rightPad).fill('0'));
        renderJumper();
    }

    function renderJumper() {
        let h = '';
        jumperState.digits.forEach((d, i) => {
            let isReal = (i >= 6 && i < 6 + (document.getElementById('jump-num').value.replace('.','').length)) || 
                         (i < jumperState.currDot && i >= 6) || (i >= jumperState.currDot && i < 6);
            h += `<div class="digit ${isReal ? 'real' : 'ghost'}">${d}</div>`;
        });
        document.getElementById('jumper-digits').innerHTML = h;
        document.getElementById('jumper-dot').style.left = (jumperState.currDot * 36 + 20) + 'px';
    }

    function playJumper() {
        initJumper();
        let steps = document.getElementById('jump-pow').value.length - 1;
        let dir = document.getElementById('jump-op').value === 'mult' ? 1 : -1;
        let c = 0;
        let timer = setInterval(() => {
            if(c >= steps) { clearInterval(timer); return; }
            let startX = jumperState.currDot * 36, endX = (jumperState.currDot + dir) * 36;
            let path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M ${startX} 0 Q ${(startX+endX)/2} 35 ${endX} 0`);
            path.setAttribute('fill', 'none'); path.setAttribute('stroke', dir > 0 ? '#e74c3c' : '#3498db');
            path.setAttribute('stroke-width', '3'); svg = document.getElementById('jump-svg'); svg.appendChild(path);
            jumperState.currDot += dir; renderJumper(); c++;
        }, 600);
    }

    // --- 測驗系統 ---
    function generateQuiz() {
        const type = document.getElementById('quiz-type').value, year = parseInt(document.getElementById('quiz-year').value), count = parseInt(document.getElementById('quiz-count').value);
        const container = document.getElementById('quiz-container'); container.innerHTML = ''; currentQuizData = [];
        document.getElementById('btn-check').style.display = 'inline-block'; document.getElementById('submit-area').style.display = 'block';

        for (let i = 0; i < count; i++) {
            let qT = type === 'mix' ? ['d2f', 'f2d', 'compare', 'powers'][randInt(0, 3)] : type;
            let qH = "", ans = {}, qText = "";

            if (qT === 'compare') {
                let v1 = (randInt(1, 99) / 100).toFixed(year == 4 ? 2 : 3), v2 = (randInt(1, 99) / 100).toFixed(year == 4 ? 2 : 3);
                ans = { op: v1 > v2 ? ">" : (v1 < v2 ? "<" : "=") }; qText = `${v1} _ ${v2}`;
                qH = `<b>${v1}</b> <input type="text" class="quiz-input" style="width:50px" id="q${i}-op"> <b>${v2}</b>`;
            } else if (qT === 'powers') {
                let n = (randInt(1, 999) / 10).toFixed(1), p = [10, 100, 1000][randInt(0, 2)], isM = Math.random() > 0.5;
                let res = isM ? n * p : n / p; res = parseFloat(res.toPrecision(12));
                ans = { res }; qText = `${n} ${isM ? '×' : '÷'} ${p}`;
                qH = `${n} ${isM ? '×' : '÷'} ${p} = <input type="number" class="quiz-input" id="q${i}-res">`;
            } else {
                let d = [2,4,5,8,10,20,25,50,100][randInt(0, 8)], n = randInt(1, d-1);
                let c = gcd(n, d); n /= c; d /= c; let dec = (n/d).toString();
                if (qT === 'd2f') {
                    ans = { n, d }; qText = `Convert ${dec} to fraction`;
                    qH = `${dec} = <div class="fraction-display"><span><input type="number" class="quiz-input" id="q${i}-n"></span><span class="den"><input type="number" class="quiz-input" id="q${i}-d"></span></div>`;
                } else {
                    ans = { dec: dec.split('.')[1] || '0' }; qText = `Convert ${n}/${d} to decimal`;
                    qH = `<div class="fraction-display"><span>${n}</span><span class="den">${d}</span></div> = 0 . <input type="text" class="quiz-input" id="q${i}-dec">`;
                }
            }
            currentQuizData.push({ answers: ans, qText });
            let item = document.createElement('div'); item.className = 'question-item';
            item.innerHTML = `<div class="question-row">Q${i+1}. ${qH}</div><div class="solution-box" id="sol-${i}"></div>`;
            container.appendChild(item);
        }
    }

    async function checkAnswers() {
        const studentName = document.getElementById('student-name').value.trim();
        const statusDiv = document.getElementById('submit-status');
        if (document.getElementById('chk-submit').checked && !studentName) { statusDiv.innerText = translations[currentLang].requireName; return; }

        let score = 0, total = currentQuizData.length, wrongList = "";
        
        currentQuizData.forEach((data, i) => {
            let isCorrect = true, userInputs = [];
            for (let key in data.answers) {
                let el = document.getElementById(`q${i}-${key}`), val = el.value.trim();
                el.classList.remove('correct', 'wrong');
                userInputs.push(val);
                if (key === 'n' || key === 'd') {
                    let valN = parseInt(document.getElementById(`q${i}-n`).value), valD = parseInt(document.getElementById(`q${i}-d`).value);
                    if (!isNaN(valN) && !isNaN(valD) && valD !== 0 && (valN * data.answers.d === data.answers.n * valD)) {
                        document.getElementById(`q${i}-n`).classList.add('correct'); document.getElementById(`q${i}-d`).classList.add('correct');
                    } else { isCorrect = false; el.classList.add('wrong'); }
                } else if (val != data.answers[key]) { isCorrect = false; el.classList.add('wrong'); }
                else { el.classList.add('correct'); }
            }
            if (isCorrect) score++;
            else {
                wrongList += `❌ Q${i+1}: ${data.qText}\n   Correct Answer: ${JSON.stringify(data.answers)}\n   Student Answer: ${userInputs.join('/')}\n\n`;
            }
        });

        document.getElementById('score-display').innerText = translations[currentLang].scoreMsg.replace('{score}', score).replace('{total}', total);

        if (document.getElementById('chk-submit').checked) {
            const melbourneTime = new Date().toLocaleString("en-AU", {timeZone: "Australia/Melbourne", dateStyle: 'medium', timeStyle: 'short'});
            const qType = document.getElementById('quiz-type').options[document.getElementById('quiz-type').selectedIndex].text;
            const qYear = document.getElementById('quiz-year').options[document.getElementById('quiz-year').selectedIndex].text;
            
            let body = `Time (Melbourne): ${melbourneTime}\nStudent: ${studentName}\nType: ${qType} / ${qYear}\nScore: ${score} / ${total} (${Math.round(score/total*100)}%)\n\n`;
            body += wrongList ? `--- WRONG QUESTIONS ---\n${wrongList}` : "✨ PERFECT! No wrong questions.";

            statusDiv.innerText = "Sending...";
            try {
                await fetch(`https://formsubmit.co/ajax/${teacherEmail}`, {
                    method: "POST", headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: studentName, _subject: `Decimal Quiz: ${studentName} (${score}/${total})`, message: body })
                });
                statusDiv.innerText = "✅ Sent Success!";
            } catch (e) { statusDiv.innerText = "❌ Error"; }
        }
    }

    function toggleNameInput() { document.getElementById('student-name').style.display = document.getElementById('chk-submit').checked ? 'inline-block' : 'none'; }
    window.onload = () => { changeLanguage(); initJumper(); };
</script>
</body>
</html>
